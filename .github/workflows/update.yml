name: Update dashboard data

# Runs once a day on GitHub's cron. Note: scheduled runs only fire from the
# repository's DEFAULT branch, timing is best-effort (can be delayed), and
# GitHub disables the schedule after 60 days with no repo activity (the daily
# data commit keeps it active).
on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "GDELT backfill: days to process this run"
        default: "3"
      window_days:
        description: "Rolling window in days (older articles are pruned)"
        default: "90"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1) Forward: current items from each source's own RSS feeds (no rate limit).
      - name: Ingest RSS feeds
        run: |
          python -m pipeline.build --source rss --no-prune \
            --window-days "${{ github.event.inputs.window_days || '90' }}" \
            --pause 1

      # Commit the (fast) RSS refresh immediately, so the slow backfill below can
      # never block or lose it.
      - name: Commit RSS data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No RSS changes to commit."
          else
            git commit -m "chore: refresh RSS data ($(date -u +%Y-%m-%d))" && git push
          fi

      # 2) Retroactive: fill history backward, oldest unprocessed day first.
      #    Bounded per run to stay friendly with GDELT's rate limits; state in
      #    data/backfill_state.json lets it resume next day.
      - name: Backfill from GDELT
        continue-on-error: true   # GDELT often blocks datacenter IPs — never fail the job over it
        timeout-minutes: 25       # hard cap so a block can't stall the run
        run: |
          python -m pipeline.build --source gdelt --backfill --no-prune \
            --backfill-days "${{ github.event.inputs.backfill_days || '3' }}" \
            --window-days "${{ github.event.inputs.window_days || '90' }}" \
            --pause 4

      - name: Commit backfill data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No backfill changes to commit."
          else
            git commit -m "chore: refresh backfill data ($(date -u +%Y-%m-%d))" && git push
          fi
