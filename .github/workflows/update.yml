name: Update dashboard data

# Runs once a day on GitHub's cron. Note: scheduled runs only fire from the
# repository's DEFAULT branch, timing is best-effort (can be delayed), and
# GitHub disables the schedule after 60 days with no repo activity (the daily
# data commit keeps it active).
on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "GDELT backfill: days to process this run"
        default: "5"
      window_days:
        description: "Rolling window in days (older articles are pruned)"
        default: "90"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1) Forward: current items from each source's own RSS feeds (no rate limit).
      - name: Ingest RSS feeds
        run: |
          python -m pipeline.build --source rss \
            --window-days "${{ github.event.inputs.window_days || '90' }}" \
            --pause 1

      # 2) Retroactive: fill history backward, oldest unprocessed day first.
      #    Bounded per run to stay friendly with GDELT's rate limits; state in
      #    docs/data/backfill_state.json lets it resume next day.
      - name: Backfill from GDELT
        run: |
          python -m pipeline.build --source gdelt --backfill \
            --backfill-days "${{ github.event.inputs.backfill_days || '5' }}" \
            --window-days "${{ github.event.inputs.window_days || '90' }}" \
            --pause 6

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
