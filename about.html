<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate-Silent Coverage — About</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap prose">
    <header class="site">
      <h1 data-i18n="about_title"></h1>
      <div class="header-actions">
        <select id="uiLang" class="ui-lang" aria-label="Interface language"></select>
        <a class="about-link" href="https://github.com/nopressurelab/summer-2026" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <button class="theme-toggle" id="themeToggle" type="button"></button>
      </div>
    </header>

    <p><a class="about-link" href="index.html" data-i18n="back"></a></p>

    <p class="lead" data-i18n="about_intro"></p>

    <h2 data-i18n="h_how"></h2>
    <p data-i18n="p_how"></p>

    <h2 data-i18n="h_flags"></h2>
    <p data-i18n="p_flags"></p>

    <h2 data-i18n="h_limits"></h2>
    <ul>
      <li data-i18n="lim1"></li>
      <li data-i18n="lim2"></li>
      <li data-i18n="lim3"></li>
      <li data-i18n="lim4"></li>
    </ul>

    <p style="margin-top:32px"><a class="about-link" href="index.html" data-i18n="back"></a></p>
  </div>

  <script src="i18n.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);

      function apply() {
        document.documentElement.lang = getLocale();
        document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t(el.getAttribute("data-i18n")); });
        $("themeToggle").textContent = "◐ " + t("theme");
        $("uiLang").setAttribute("aria-label", t("ui_language"));
      }
      const sel = $("uiLang");
      sel.innerHTML = LOCALES.map((l) => `<option value="${l}">${LOCALE_NAMES[l]}</option>`).join("");
      sel.value = getLocale();
      sel.addEventListener("change", () => { setLocale(sel.value); apply(); });

      $("themeToggle").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        const next = isDark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
      apply();
    })();
  </script>
</body>
</html>
